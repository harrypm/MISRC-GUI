  macos-app-build:
    name: macOS APP build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    needs:
      - preflight-guard-tests
      - preflight-cross-platform-guards
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache vendored deps (.deps/install)
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: .deps/install
          key: deps-macos-${{ matrix.arch }}-raylib5.5-libuvc-v0.0.7-${{ hashFiles('third_party/hsdaoh/**') }}

      - name: Resolve build version
        id: version
        env:
          GITHUB_REF: ${{ github.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_CREATE_RELEASE: ${{ github.event.inputs.create_release }}
          CI_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -eux
          VERSION="$(misrc_tools/ci-resolve-version.sh)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        env:
          # GitHub-hosted macOS runners ship a recently-updated Homebrew, so
          # skip the slow `brew update` (which also triggers re-linking that
          # emits the 'files were overwritten during the brew link step'
          # annotation). Only install formulas that are not already present.
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -eux
          for tap_dir in \
            /opt/homebrew/Library/Taps/aws/homebrew-tap \
            /opt/homebrew/Library/Taps/azure/homebrew-bicep \
            /opt/homebrew/Library/Taps/hashicorp/homebrew-tap \
            /usr/local/Homebrew/Library/Taps/aws/homebrew-tap \
            /usr/local/Homebrew/Library/Taps/azure/homebrew-bicep \
            /usr/local/Homebrew/Library/Taps/hashicorp/homebrew-tap; do
            rm -rf "$tap_dir"
          done
          for formula in cmake fftw flac libusb libuvc meson nasm ninja pkgconf libsoxr; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          done

      - name: Build and stage architecture app bundle
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          MACOS_ARCH: ${{ matrix.arch }}
          MISRC_TOOLS_VERSION_OVERRIDE: ${{ steps.version.outputs.version }}
        run: |
          set -eux
          DEPS_PREFIX="$PWD/.deps/install"
          FLAC_PREFIX="$(brew --prefix flac)"
          BREW_PREFIX="$(brew --prefix)"
          export CPPFLAGS="-I${BREW_PREFIX}/include ${CPPFLAGS:-}"
          export CFLAGS="-arch ${MACOS_ARCH} ${CFLAGS:-}"
          export CXXFLAGS="-arch ${MACOS_ARCH} ${CXXFLAGS:-}"
          export LDFLAGS="-arch ${MACOS_ARCH} ${LDFLAGS:-}"
          mkdir -p .deps

          # Cache hit guard: skip hsdaoh/raylib rebuild if .deps/install was
          # restored from actions/cache (key includes hashFiles(hsdaoh/**)).
          if [[ ! -f "$DEPS_PREFIX/lib/pkgconfig/hsdaoh.pc" ]]; then
          rm -rf .deps/hsdaoh
          cp -R third_party/hsdaoh .deps/hsdaoh
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git .deps/raylib
          cmake -S .deps/hsdaoh -B .deps/hsdaoh/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-I${FLAC_PREFIX}/include -I${BREW_PREFIX}/include" \
            -DCMAKE_OSX_ARCHITECTURES="${MACOS_ARCH}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DINSTALL_UDEV_RULES=OFF
          cmake --build .deps/hsdaoh/build --parallel
          cmake --install .deps/hsdaoh/build
          for PCDIR in "$DEPS_PREFIX/lib/pkgconfig" "$DEPS_PREFIX/lib64/pkgconfig"; do
            if [[ -f "$PCDIR/libhsdaoh.pc" && ! -f "$PCDIR/hsdaoh.pc" ]]; then
              cp "$PCDIR/libhsdaoh.pc" "$PCDIR/hsdaoh.pc"
            fi
          done
          cmake -S .deps/raylib -B .deps/raylib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${MACOS_ARCH}" \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX"
          cmake --build .deps/raylib/build --parallel
          cmake --install .deps/raylib/build
          else
            echo "deps cache hit - skipping hsdaoh/raylib rebuild"
          fi

          export PKG_CONFIG_PATH="$DEPS_PREFIX/lib/pkgconfig:$DEPS_PREFIX/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="$DEPS_PREFIX:${CMAKE_PREFIX_PATH:-}"
          pkg-config --modversion fftw3f
          meson setup "$BUILD_DIR" misrc_tools --buildtype release
          meson compile -C "$BUILD_DIR" misrc_capture misrc_extract misrc_gui

          "$BUILD_DIR/misrc_gui" --smoke-test
          set +e
          "$BUILD_DIR/misrc_capture" -h > /tmp/macos_capture_help.txt 2>&1
          RC_CAPTURE=$?
          "$BUILD_DIR/misrc_extract" -h > /tmp/macos_extract_help.txt 2>&1
          RC_EXTRACT=$?
          set -e
          test "$RC_CAPTURE" -eq 1
          test "$RC_EXTRACT" -eq 1
          grep -qi "Usage" /tmp/macos_capture_help.txt
          grep -qi "Usage" /tmp/macos_extract_help.txt

          # Post-build CI guard tests: assert no stale Homebrew hsdaoh linkage
          # (macOS must use the vendored .deps/install hsdaoh via @rpath) + FX3 symbols.
          python3 misrc_tools/test/ci_guard_tests.py --post-build --gui-path "$BUILD_DIR/misrc_gui"

          APP_ROOT="dist/MISRC.app/Contents"
          FW_DIR="$APP_ROOT/Frameworks"
          mkdir -p "$APP_ROOT/MacOS" "$APP_ROOT/Resources" "$FW_DIR"
          ICON_SRC="assets/Icons/MISRC_Icon.png"
          test -f "$ICON_SRC"
          ICONSET_DIR="dist/MISRC.iconset"
          mkdir -p "$ICONSET_DIR"
          sips -z 16 16 "$ICON_SRC" --out "$ICONSET_DIR/icon_16x16.png"
          sips -z 32 32 "$ICON_SRC" --out "$ICONSET_DIR/icon_16x16@2x.png"
          sips -z 32 32 "$ICON_SRC" --out "$ICONSET_DIR/icon_32x32.png"
          sips -z 64 64 "$ICON_SRC" --out "$ICONSET_DIR/icon_32x32@2x.png"
          sips -z 128 128 "$ICON_SRC" --out "$ICONSET_DIR/icon_128x128.png"
          sips -z 256 256 "$ICON_SRC" --out "$ICONSET_DIR/icon_128x128@2x.png"
          sips -z 256 256 "$ICON_SRC" --out "$ICONSET_DIR/icon_256x256.png"
          sips -z 512 512 "$ICON_SRC" --out "$ICONSET_DIR/icon_256x256@2x.png"
          sips -z 512 512 "$ICON_SRC" --out "$ICONSET_DIR/icon_512x512.png"
          sips -z 1024 1024 "$ICON_SRC" --out "$ICONSET_DIR/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET_DIR" -o "$APP_ROOT/Resources/MISRC.icns"
          rm -rf "$ICONSET_DIR"
          cp "$BUILD_DIR/misrc_gui" "$APP_ROOT/MacOS/MISRC"
          cp "$BUILD_DIR/misrc_capture" "$APP_ROOT/MacOS/misrc_capture"
          cp "$BUILD_DIR/misrc_extract" "$APP_ROOT/MacOS/misrc_extract"
          chmod +x "$APP_ROOT/MacOS/MISRC" "$APP_ROOT/MacOS/misrc_capture" "$APP_ROOT/MacOS/misrc_extract"

          cat > "$APP_ROOT/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>MISRC</string>
            <key>CFBundleDisplayName</key>
            <string>MISRC</string>
            <key>CFBundleIdentifier</key>
            <string>dev.misrc.gui</string>
            <key>CFBundleVersion</key>
            <string>__BUILD_VERSION__</string>
            <key>CFBundleShortVersionString</key>
            <string>__BUILD_VERSION__</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>MISRC</string>
            <key>CFBundleIconFile</key>
            <string>MISRC</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
          </dict>
          </plist>
          EOF
          sed -i '' "s/__BUILD_VERSION__/${BUILD_VERSION}/g" "$APP_ROOT/Info.plist"


          shopt -s nullglob
          is_system_lib() {
            case "$1" in
              /System/*|/usr/lib/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          resolve_dep_path() {
            local dep="$1"
            if [[ "$dep" == @rpath/* ]]; then
              local name="${dep#@rpath/}"
              local candidates=(
                "$DEPS_PREFIX/lib/$name"
                "$DEPS_PREFIX/lib64/$name"
                "$BREW_PREFIX/lib/$name"
                $BREW_PREFIX/opt/*/lib/"$name"
              )
              local candidate
              for candidate in "${candidates[@]}"; do
                if [[ -f "$candidate" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
                fi
              done
              return 1
            fi
            printf '%s\n' "$dep"
          }

          collect_dep_tree() {
            local dep="$1"
            if is_system_lib "$dep"; then
              return 0
            fi
            local resolved
            resolved="$(resolve_dep_path "$dep")" || {
              echo "Unable to resolve dylib dependency: $dep" >&2
              return 1
            }
            local base
            base="$(basename "$resolved")"
            if [[ ! -f "$FW_DIR/$base" ]]; then
              cp "$resolved" "$FW_DIR/$base"
              chmod +w "$FW_DIR/$base"
              install_name_tool -id "@rpath/$base" "$FW_DIR/$base"
              while IFS= read -r subdep; do
                collect_dep_tree "$subdep"
              done < <(otool -L "$FW_DIR/$base" | tail -n +2 | awk '{print $1}')
            fi
          }

          patch_macho_refs() {
            local target="$1"
            chmod +w "$target" || true
            while IFS= read -r dep; do
              if is_system_lib "$dep"; then
                continue
              fi
              local base
              if [[ "$dep" == @rpath/* ]]; then
                base="$(basename "${dep#@rpath/}")"
              else
                base="$(basename "$dep")"
              fi
              if [[ -f "$FW_DIR/$base" ]]; then
                install_name_tool -change "$dep" "@rpath/$base" "$target" || true
              fi
            done < <(otool -L "$target" | tail -n +2 | awk '{print $1}')
          }

          for BIN in "$APP_ROOT/MacOS/MISRC" "$APP_ROOT/MacOS/misrc_capture" "$APP_ROOT/MacOS/misrc_extract"; do
            while IFS= read -r dep; do
              collect_dep_tree "$dep"
            done < <(otool -L "$BIN" | tail -n +2 | awk '{print $1}')
          done

          for BIN in "$APP_ROOT/MacOS/MISRC" "$APP_ROOT/MacOS/misrc_capture" "$APP_ROOT/MacOS/misrc_extract"; do
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$BIN" 2>/dev/null || true
            patch_macho_refs "$BIN"
          done
          for DYLIB in "$FW_DIR"/*.dylib; do
            patch_macho_refs "$DYLIB"
          done

          if otool -L "$APP_ROOT/MacOS/MISRC" | grep -E '/opt/homebrew|/usr/local/opt'; then
            echo "Found non-portable Homebrew dylib path in MISRC binary" >&2
            exit 1
          fi
          if otool -L "$APP_ROOT/MacOS/misrc_capture" | grep -E '/opt/homebrew|/usr/local/opt'; then
            echo "Found non-portable Homebrew dylib path in misrc_capture binary" >&2
            exit 1
          fi

          "$APP_ROOT/MacOS/MISRC" --smoke-test
          set +e
          "$APP_ROOT/MacOS/misrc_capture" -h > /tmp/macos_bundle_capture_help.txt 2>&1
          RC_CAPTURE=$?
          "$APP_ROOT/MacOS/misrc_extract" -h > /tmp/macos_bundle_extract_help.txt 2>&1
          RC_EXTRACT=$?
          set -e
          test "$RC_CAPTURE" -eq 1
          test "$RC_EXTRACT" -eq 1
          grep -qi "Usage" /tmp/macos_bundle_capture_help.txt
          grep -qi "Usage" /tmp/macos_bundle_extract_help.txt

          codesign --force --deep --sign - dist/MISRC.app
          echo "$BUILD_VERSION" > dist/BUILD_VERSION.txt

      - name: Upload macOS architecture stage
        uses: actions/upload-artifact@v7
        with:
          name: macos-app-stage-${{ matrix.arch }}
          path: |
            dist/MISRC.app
            dist/BUILD_VERSION.txt
          if-no-files-found: error

  macos-app-universal:
    name: macOS APP build (universal)
    runs-on: macos-15
    needs:
      - macos-app-build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download arm64 stage
        uses: actions/download-artifact@v8
        with:
          name: macos-app-stage-arm64
          path: stage-arm64

      - name: Download x86_64 stage
        uses: actions/download-artifact@v8
        with:
          name: macos-app-stage-x86_64
          path: stage-x86_64

      - name: Merge universal app and package DMG
        id: package
        run: |
          set -eux
          BUILD_VERSION="$(cat stage-arm64/BUILD_VERSION.txt)"
          echo "version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          cp -R stage-arm64/MISRC.app dist/MISRC.app

          while IFS= read -r rel; do
            ARM_FILE="stage-arm64/${rel}"
            X86_FILE="stage-x86_64/${rel}"
            OUT_FILE="dist/${rel}"
            if file "$ARM_FILE" | grep -q "Mach-O"; then
              lipo -create "$ARM_FILE" "$X86_FILE" -output "$OUT_FILE"
            else
              cp "$ARM_FILE" "$OUT_FILE"
            fi
          done < <(cd stage-arm64 && find MISRC.app -type f | sort)
          chmod +x dist/MISRC.app/Contents/MacOS/MISRC dist/MISRC.app/Contents/MacOS/misrc_capture dist/MISRC.app/Contents/MacOS/misrc_extract

          codesign --force --deep --sign - dist/MISRC.app

          LIPO_ARCHS="$(lipo -archs dist/MISRC.app/Contents/MacOS/MISRC)"
          echo "$LIPO_ARCHS" | grep -q 'arm64'
          echo "$LIPO_ARCHS" | grep -q 'x86_64'

          dist/MISRC.app/Contents/MacOS/MISRC --smoke-test
          set +e
          dist/MISRC.app/Contents/MacOS/misrc_capture -h > /tmp/macos_universal_capture_help.txt 2>&1
          RC_CAPTURE=$?
          dist/MISRC.app/Contents/MacOS/misrc_extract -h > /tmp/macos_universal_extract_help.txt 2>&1
          RC_EXTRACT=$?
          set -e
          test "$RC_CAPTURE" -eq 1
          test "$RC_EXTRACT" -eq 1
          grep -qi "Usage" /tmp/macos_universal_capture_help.txt
          grep -qi "Usage" /tmp/macos_universal_extract_help.txt
          DMG_STAGE_DIR="dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          cp -R dist/MISRC.app "$DMG_STAGE_DIR/MISRC.app"
          ln -s /Applications "$DMG_STAGE_DIR/Applications"
          DMG_NAME="macOS_MISRC_GUI_${BUILD_VERSION}_universal.dmg"
          hdiutil create \
            -volname "MISRC" \
            -srcfolder "$DMG_STAGE_DIR" \
            -ov \
            -format UDZO \
            "$DMG_NAME"
          test -f "$DMG_NAME"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: macOS_MISRC_GUI_*_universal.dmg
          if-no-files-found: error

  release:
    name: Publish release assets
    runs-on: ubuntu-24.04
    needs:
      - linux-appimage
      - windows-exe
      - windows-exe-arm64
      - macos-app-universal
      - android-apk
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Resolve release tag
        id: tag
        run: |
          set -eux
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.release_tag }}"
            if [[ -z "$TAG" ]]; then
              echo "release_tag is required when create_release=true" >&2
              exit 1
            fi
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "$TAG"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Assert release assets are tag-named (no dev leak)
        run: |
          set -eu
          TAG="${{ steps.tag.outputs.tag }}"
          shopt -s globstar nullglob
          artifacts=(
            release-assets/**/*_MISRC_GUI_*.zip
            release-assets/**/*_MISRC_GUI_*.dmg
            release-assets/**/*_MISRC_GUI_*.apk
          )
          if [[ "${#artifacts[@]}" -eq 0 ]]; then
            echo "ERROR: no release artifacts found in release-assets/" >&2
            exit 1
          fi
          for f in "${artifacts[@]}"; do
            base="$(basename "$f")"
            case "$base" in
              *_MISRC_GUI_dev-*)
                echo "ERROR: release artifact '$base' is dev-named; refusing to publish under tag $TAG" >&2
                exit 1
                ;;
              *"$TAG"*) : ;;
              *)
                echo "ERROR: release artifact '$base' does not contain the release tag $TAG" >&2
                exit 1
                ;;
            esac
          done
          echo "All ${#artifacts[@]} release assets are tag-named ($TAG)."

      - name: Build release summary
        id: summary
        run: |
          set -eu
          TAG="${{ steps.tag.outputs.tag }}"
          # Find the previous tag for the Highlights log range.
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
            LOG_RANGE="${PREV_TAG}..${TAG}"
          else
            LOG_RANGE="${TAG}"
          fi
          # Build the structured release body. generate_release_notes: true
          # appends GitHub's auto-generated What's Changed PR list after this
          # body, matching the v1.1.0 release format. Write each line with
          # printf to avoid heredoc backtick-escaping issues.
          BODY_FILE="/tmp/release_body.md"
          : > "$BODY_FILE"
          printf '%s\n' '' '## Highlights' '' >> "$BODY_FILE"
          git log --pretty=format:'- %s (%h)' --no-merges "$LOG_RANGE" 2>/dev/null >> "$BODY_FILE" || true
          if [[ "$(tail -1 "$BODY_FILE")" == '## Highlights' ]]; then
            printf '%s\n' "- (no commits found in range ${LOG_RANGE})" >> "$BODY_FILE"
          fi
          # Contributors as GitHub @handles (de-duplicated). Handles are
          # derived from commit author emails: noreply github emails resolve
          # automatically (<handle>@users.noreply.github.com or
          # <id>+<handle>@users.noreply.github.com), and an explicit
          # email=handle map covers non-noreply emails. Commits whose email
          # can't be resolved are skipped (their work is still credited via
          # Highlights + GitHub's auto-generated What's Changed). No author
          # emails or raw names are published.
          CONTRIBUTOR_HANDLE_MAP="
            harry@opcomedia.com=harrypm
          "
          github_handle_for_email() {
            local email="$1"
            while IFS='=' read -r map_email map_handle; do
              map_email="${map_email// /}"; map_handle="${map_handle// /}"
              [[ -z "$map_email" ]] && continue
              if [[ "${email,,}" == "${map_email,,}" ]]; then
                printf '%s' "$map_handle"
                return 0
              fi
            done <<< "$CONTRIBUTOR_HANDLE_MAP"
            case "$email" in
              *"+*"@users.noreply.github.com) printf '%s' "${email%%+*}"; return 0 ;;
              *@users.noreply.github.com)     printf '%s' "${email%@users.noreply.github.com}"; return 0 ;;
            esac
            return 1
          }
          printf '\n%s\n' '' '## Contributors' '' >> "$BODY_FILE"
          CONTRIB_HANDLES="$(git log --pretty=format:'%ae' --no-merges "$LOG_RANGE" 2>/dev/null | sort -u | while IFS= read -r email; do
            handle="$(github_handle_for_email "$email")" && printf '%s\n' "@$handle"
          done | sort -u)"
          if [[ -n "$CONTRIB_HANDLES" ]]; then
            while IFS= read -r h; do
              [[ -n "$h" ]] || continue
              printf -- '- %s\n' "$h" >> "$BODY_FILE"
            done <<< "$CONTRIB_HANDLES"
          else
            printf '%s\n' "- (no contributors found in range ${LOG_RANGE})" >> "$BODY_FILE"
          fi
          printf '\n%s\n' '' '## Downloads' '' >> "$BODY_FILE"
          printf '| Platform | x86_64 (Intel / AMD) | arm64 (Apple Silicon / aarch64) | Android (arm64-v8a APK) |\n' >> "$BODY_FILE"
          printf '|---|---|---|---|\n' >> "$BODY_FILE"
          DL_BASE="https://github.com/harrypm/MISRC-GUI/releases/download/${TAG}"
          WIN_X86="Windows_MISRC_GUI_${TAG}_x86.zip"
          WIN_ARM="Windows_MISRC_GUI_${TAG}_arm64.zip"
          MAC_DMG="macOS_MISRC_GUI_${TAG}_universal.dmg"
          LIN_X86="Linux_MISRC_GUI_${TAG}_x86.zip"
          LIN_ARM="Linux_MISRC_GUI_${TAG}_arm64.zip"
          APK_ARM64="Android_MISRC_GUI_${TAG}_arm64.apk"
          printf '| Windows 10/11 | [%s](%s/%s) | [%s](%s/%s) | - |\n' "$WIN_X86" "$DL_BASE" "$WIN_X86" "$WIN_ARM" "$DL_BASE" "$WIN_ARM" >> "$BODY_FILE"
          printf '| macOS 11+ | [%s](%s/%s) | [%s](%s/%s) | - |\n' "$MAC_DMG" "$DL_BASE" "$MAC_DMG" "$MAC_DMG" "$DL_BASE" "$MAC_DMG" >> "$BODY_FILE"
          printf '| Linux (Ubuntu 22.04+) | [%s](%s/%s) | [%s](%s/%s) | - |\n' "$LIN_X86" "$DL_BASE" "$LIN_X86" "$LIN_ARM" "$DL_BASE" "$LIN_ARM" >> "$BODY_FILE"
          printf '| Android 11+ | - | - | [%s](%s/%s) |\n' "$APK_ARM64" "$DL_BASE" "$APK_ARM64" >> "$BODY_FILE"
          # GitHub admonition: the > [!NOTE] line MUST be immediately followed
          # by the > content lines with NO blank line between them, or GitHub
          # renders it as plain quoted text instead of a note box. Do NOT use
          # printf '\n%s\n' with multiple args here — printf reuses the format
          # per arg, which inserts a blank line after [!NOTE] and breaks the box.
          printf '\n%s\n' '> [!NOTE]' >> "$BODY_FILE"
          printf '%s\n' '> The arm64 Windows build is untested and considered experimental.' >> "$BODY_FILE"
          printf '%s\n' '> Android support is very alpha and experimental.' >> "$BODY_FILE"
          # Write multi-line output to GITHUB_OUTPUT.
          {
            echo "body<<BODY_EOF"
            cat "$BODY_FILE"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: MISRC GUI ${{ steps.tag.outputs.tag }}
          body: ${{ steps.summary.outputs.body }}
          generate_release_notes: true
          files: |
            release-assets/**/Linux_MISRC_GUI_*_x86.zip
            release-assets/**/Linux_MISRC_GUI_*_arm64.zip
            release-assets/**/Windows_MISRC_GUI_*_x86.zip
            release-assets/**/Windows_MISRC_GUI_*_arm64.zip
            release-assets/**/macOS_MISRC_GUI_*_universal.dmg
            release-assets/**/Android_MISRC_GUI_*_arm64.apk

      # Same-run verification of what every installed app will pull for this
      # tag: the repo manifest (the commit being released) must name every
      # platform asset correctly for the just-published tag, or a confirmed
      # self-update would download a 404 (the v1.2.4-class bug). Live raw-main
      # equality is not asserted here (the raw CDN can lag the push).
      - name: Verify release download links (repo manifest)
        run: |
          set -eux
          python3 misrc_tools/test/release_link_check.py --tag "${{ steps.tag.outputs.tag }}"
