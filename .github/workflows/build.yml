name: Build and release binary

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub release and upload built assets"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Tag to release when manually dispatched (example: v0.6.0)"
        required: false
        type: string
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # Direct pushes to main run the guard+build jobs too (regression e34dce9:
  # a guard break was pushed straight to main and sat latent for a day until
  # a manual workflow_dispatch run failed). The release job stays gated on
  # refs/tags/* / workflow_dispatch create_release, so branch pushes build
  # but never publish.
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

env:
  BUILD_DIR: build-gha
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight-guard-tests:
    name: Preflight guard tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run CI guard tests
        run: |
          set -eux
          python3 misrc_tools/test/ci_guard_tests.py
  preflight-cross-platform-guards:
    name: Cross-platform guard tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            guard_mode: static
          - runner: windows-2022
            guard_mode: static
          - runner: macos-15
            guard_mode: runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run static CI guard tests
        if: matrix.guard_mode == 'static'
        run: |
          python misrc_tools/test/ci_guard_tests.py --static-only

      - name: Run runtime CI guard tests
        if: matrix.guard_mode == 'runtime'
        run: |
          python misrc_tools/test/ci_guard_tests.py
  release-link-check:
    name: Release download link check
    runs-on: ubuntu-24.04
    needs:
      - preflight-guard-tests
      - preflight-cross-platform-guards
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # End-to-end check of the manifest-driven update pipeline (the 2026-10-22
      # rework): the updater (gui_updater.h/.c + gui_ui.c) pulls the auto-patch
      # update_manifest.json from a fixed raw URL on main, the manual button
      # opens the releases PAGE (a page cannot 404 per platform), and confirmed
      # self-update downloads the manifest-named assets. This test fetches the
      # LIVE manifest exactly as the app does, validates it, HEAD-checks the
      # manifest's releases page, resolves the latest tag via the manifest's
      # tag lookup, HEAD-checks all six manifest-built asset URLs (the exact
      # URLs a confirmed self-update downloads), and cross-checks the repo
      # manifest against the latest published release. The v1.2.4-class
      # regression (asset naming drift -> every platform 404) is now caught
      # here AND is remotely patchable: a fix is a commit to update_manifest.json
      # on main, not a new release. The release job re-runs it with --tag
      # against the tag it just publishes.
      - name: Verify the manifest-driven update download pipeline
        run: |
          set -eux
          python3 misrc_tools/test/release_link_check.py

  linux-appimage:
    name: Linux AppImage build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            linuxdeploy_arch: x86_64
            artifact_suffix: x86
          - arch: arm64
            runner: ubuntu-22.04-arm
            linuxdeploy_arch: aarch64
            artifact_suffix: arm64
    runs-on: ${{ matrix.runner }}
    needs:
      - preflight-guard-tests
      - preflight-cross-platform-guards
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache vendored deps (.deps/install)
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: .deps/install
          key: deps-linux-${{ matrix.arch }}-raylib5.5-libuvc-v0.0.7-flac1.5.0-${{ hashFiles('third_party/hsdaoh/**') }}

      - name: Resolve build version
        id: version
        env:
          GITHUB_REF: ${{ github.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_CREATE_RELEASE: ${{ github.event.inputs.create_release }}
          CI_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -eux
          VERSION="$(misrc_tools/ci-resolve-version.sh)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            curl \
            git \
            imagemagick \
            libasound2-dev \
            libfftw3-dev \
            libgl1-mesa-dev \
            libusb-1.0-0-dev \
            libuvc-dev \
            libsoxr-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            meson \
            nasm \
            ninja-build \
            patchelf \
            pkg-config \
            unzip \
            zip

      - name: Fetch libFLAC 1.5.0 cache + build hsdaoh/raylib
        run: |
          set -eux
          DEPS_PREFIX="$PWD/.deps/install"
          mkdir -p .deps

          # Cache hit guard: if .deps/install was restored from actions/cache
          # (key includes hashFiles(third_party/hsdaoh/**) + raylib/libuvc/flac
          # versions), skip the FLAC/hsdaoh/raylib rebuild entirely. A source
          # change invalidates the cache key and forces a clean rebuild.
          if [[ -f "$DEPS_PREFIX/lib/pkgconfig/hsdaoh.pc" ]]; then
            echo "deps cache hit - skipping hsdaoh/raylib/flac rebuild"
            PKG_CONFIG_PATH="${DEPS_PREFIX}/lib/pkgconfig:${DEPS_PREFIX}/lib64/pkgconfig" \
              pkg-config --modversion flac
            exit 0
          fi

          # libFLAC 1.5.0 is required by misrc_tools/meson.build for the
          # multithreaded encoder (FLAC__stream_encoder_set_num_threads, libFLAC
          # API v14). Ubuntu 22.04's libflac-dev apt is stuck at 1.3.3, so fetch a
          # prebuilt static lib from the harrypm/MISRC-ci-cache release (built on
          # jammy/glibc-2.35, ABI-compatible with the runners). The arm64 prebuilt
          # is produced by the one-off .github/workflows/flac-cache.yml job; until
          # it exists the arm64 job falls back to building from the cached source
          # tarball, so arm64 stays unblocked without the cache.
          FLAC_VERSION="1.5.0"
          CACHE_BASE="https://github.com/harrypm/MISRC-ci-cache/releases/download/flac-${FLAC_VERSION}-linux"
          FLAC_ARCH="${{ matrix.arch }}"
          PREBUILT_NAME="flac-${FLAC_VERSION}-prebuilt-linux-${FLAC_ARCH}.tar.xz"
          PREBUILT_SHA_NAME="${PREBUILT_NAME}.sha256"
          SRC_NAME="flac-${FLAC_VERSION}.tar.xz"
          FLAC_SRC_SHA256="f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920"

          if curl -fsSL -o "/tmp/${PREBUILT_NAME}" "${CACHE_BASE}/${PREBUILT_NAME}" \
             && curl -fsSL -o "/tmp/${PREBUILT_SHA_NAME}" "${CACHE_BASE}/${PREBUILT_SHA_NAME}"; then
            expected="$(awk '{print $1}' "/tmp/${PREBUILT_SHA_NAME}")"
            actual="$(sha256sum "/tmp/${PREBUILT_NAME}" | awk '{print $1}')"
            [[ "${actual}" == "${expected}" ]] || { echo "prebuilt libFLAC sha mismatch: expected ${expected} got ${actual}"; exit 1; }
            rm -rf .deps/flac-prebuilt
            mkdir -p .deps/flac-prebuilt "${DEPS_PREFIX}/lib/pkgconfig" "${DEPS_PREFIX}/include"
            tar -xf "/tmp/${PREBUILT_NAME}" -C .deps/flac-prebuilt --strip-components=1
            cp -R .deps/flac-prebuilt/lib/. "${DEPS_PREFIX}/lib/"
            cp -R .deps/flac-prebuilt/include/. "${DEPS_PREFIX}/include/"
            echo "Using cached prebuilt libFLAC ${FLAC_VERSION} for ${FLAC_ARCH}"
          else
            echo "No prebuilt libFLAC for ${FLAC_ARCH}; building from cached source tarball."
            curl -fsSL -o "/tmp/${SRC_NAME}" "${CACHE_BASE}/${SRC_NAME}"
            echo "${FLAC_SRC_SHA256}  /tmp/${SRC_NAME}" | sha256sum -c -
            rm -rf .deps/flac-src .deps/flac
            mkdir -p .deps/flac-src
            tar -xf "/tmp/${SRC_NAME}" -C .deps/flac-src --strip-components=1
            cmake -S .deps/flac-src -B .deps/flac/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DWITH_OGG=OFF \
              -DBUILD_TESTING=OFF \
              -DCMAKE_INSTALL_PREFIX="${DEPS_PREFIX}"
            cmake --build .deps/flac/build --parallel
            cmake --install .deps/flac/build
            echo "Built libFLAC ${FLAC_VERSION} from cached source for ${FLAC_ARCH}"
          fi

          # Sanity: vendored flac.pc must report 1.5.0 before meson sees it.
          # meson.build hard-fails configure if this ever regresses below 1.5.0.
          PKG_CONFIG_PATH="${DEPS_PREFIX}/lib/pkgconfig:${DEPS_PREFIX}/lib64/pkgconfig" \
            pkg-config --modversion flac

          rm -rf .deps/hsdaoh
          cp -R third_party/hsdaoh .deps/hsdaoh
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git .deps/raylib
          # hsdaoh's CMakeLists uses pkg_check_modules(flac), so the vendored
          # flac.pc in DEPS_PREFIX must be on PKG_CONFIG_PATH now -- the apt
          # libflac-dev that used to provide a system flac.pc is no longer
          # installed. This export also benefits raylib/hsdaoh CMake finders.
          export PKG_CONFIG_PATH="${DEPS_PREFIX}/lib/pkgconfig:${DEPS_PREFIX}/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="${DEPS_PREFIX}:${CMAKE_PREFIX_PATH:-}"
          # hsdaoh's hsdaoh_file tool target includes "FLAC/metadata.h" but does
          # not link the flac pkg-config module, so it does not inherit flac's
          # -I include dir from CMake. With the old apt libflac-dev the headers
          # lived in /usr/include/FLAC (default system include path) so the
          # missing -I was masked; the vendored headers in DEPS_PREFIX/include/FLAC
          # are not on a default path. Export CFLAGS/CXXFLAGS with -I so every
          # hsdaoh target (including hsdaoh_file) can resolve FLAC/*.h.
          export CFLAGS="-I${DEPS_PREFIX}/include ${CFLAGS:-}"
          export CXXFLAGS="-I${DEPS_PREFIX}/include ${CXXFLAGS:-}"
          cmake -S .deps/hsdaoh -B .deps/hsdaoh/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DINSTALL_UDEV_RULES=OFF
          cmake --build .deps/hsdaoh/build --parallel
          cmake --install .deps/hsdaoh/build
          for PCDIR in "$DEPS_PREFIX/lib/pkgconfig" "$DEPS_PREFIX/lib64/pkgconfig"; do
            if [[ -f "$PCDIR/libhsdaoh.pc" && ! -f "$PCDIR/hsdaoh.pc" ]]; then
              cp "$PCDIR/libhsdaoh.pc" "$PCDIR/hsdaoh.pc"
            fi
          done

          cmake -S .deps/raylib -B .deps/raylib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX"
          cmake --build .deps/raylib/build --parallel
          cmake --install .deps/raylib/build

      - name: Build MISRC tools (Meson)
        env:
          MISRC_TOOLS_VERSION_OVERRIDE: ${{ steps.version.outputs.version }}
        run: |
          set -eux
          DEPS_PREFIX="$PWD/.deps/install"
          export PKG_CONFIG_PATH="$DEPS_PREFIX/lib/pkgconfig:$DEPS_PREFIX/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="$DEPS_PREFIX:${CMAKE_PREFIX_PATH:-}"
          pkg-config --modversion fftw3f
          meson setup "$BUILD_DIR" misrc_tools --buildtype release
          meson compile -C "$BUILD_DIR" misrc_capture misrc_extract misrc_gui
          test -x "$BUILD_DIR/misrc_gui"

      - name: Smoke test built binaries
        run: |
          set -eux
          "$BUILD_DIR/misrc_gui" --smoke-test
          set +e
          "$BUILD_DIR/misrc_capture" -h > /tmp/misrc_capture_help.txt 2>&1
          RC_CAPTURE=$?
          "$BUILD_DIR/misrc_extract" -h > /tmp/misrc_extract_help.txt 2>&1
          RC_EXTRACT=$?
          set -e
          test "$RC_CAPTURE" -eq 1
          test "$RC_EXTRACT" -eq 1
          grep -qi "Usage" /tmp/misrc_capture_help.txt
          grep -qi "Usage" /tmp/misrc_extract_help.txt

      - name: Post-build CI guard tests (vendored deps + FX3 enabled)
        run: |
          set -eux
          python3 misrc_tools/test/ci_guard_tests.py --post-build --gui-path "$BUILD_DIR/misrc_gui"

      - name: Package AppImage artifact
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          LINUXDEPLOY_ARCH: ${{ matrix.linuxdeploy_arch }}
        run: |
          set -eux
          mkdir -p AppDir/usr/bin
          cp "$BUILD_DIR/misrc_gui" AppDir/usr/bin/
          cp "$BUILD_DIR/misrc_capture" AppDir/usr/bin/
          cp "$BUILD_DIR/misrc_extract" AppDir/usr/bin/

          # AppRun and the desktop entry are real repo files (not inline heredocs:
          # nested EOF / $ inside YAML broke earlier workflows). AppRun installs a
          # launcher in ~/.local/share/applications only; it never writes ~/Desktop.
          install -m 0755 assets/appimage/AppRun AppDir/AppRun
          install -m 0644 assets/appimage/misrc_gui.desktop AppDir/misrc_gui.desktop
          ICON_SRC="assets/Icons/MISRC_Icon.png"
          test -f "$ICON_SRC"
          convert "$ICON_SRC" -resize 512x512\! AppDir/misrc.png
          ln -sf misrc.png AppDir/.DirIcon
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          cp AppDir/misrc.png AppDir/usr/share/icons/hicolor/512x512/apps/misrc.png

          curl -L -o linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage"
          curl -L -o linuxdeploy-plugin-appimage "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-${LINUXDEPLOY_ARCH}.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-appimage

          ARCH="$LINUXDEPLOY_ARCH" APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy \
            --appdir AppDir \
            -e AppDir/usr/bin/misrc_gui \
            -d AppDir/misrc_gui.desktop \
            -i AppDir/misrc.png \
            --output appimage

          APPIMAGE_NAME="Linux_MISRC_GUI_${BUILD_VERSION}_${{ matrix.artifact_suffix }}.AppImage"
          mv ./*.AppImage "$APPIMAGE_NAME"
          test -f "$APPIMAGE_NAME"

          APPIMAGE_EXTRACT_AND_RUN=1 "./$APPIMAGE_NAME" --smoke-test
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 "./$APPIMAGE_NAME" capture -h > /tmp/appimage_capture_help.txt 2>&1
          RC_CAPTURE=$?
          APPIMAGE_EXTRACT_AND_RUN=1 "./$APPIMAGE_NAME" extract -h > /tmp/appimage_extract_help.txt 2>&1
          RC_EXTRACT=$?
          set -e
          test "$RC_CAPTURE" -eq 1
          test "$RC_EXTRACT" -eq 1
          grep -qi "Usage" /tmp/appimage_capture_help.txt
          grep -qi "Usage" /tmp/appimage_extract_help.txt
          ZIP_NAME="Linux_MISRC_GUI_${BUILD_VERSION}_${{ matrix.artifact_suffix }}.zip"
          zip -j "$ZIP_NAME" "$APPIMAGE_NAME"
          test -f "$ZIP_NAME"
          test "$(unzip -Z1 "$ZIP_NAME" | wc -l)" -eq 1
          test "$(unzip -Z1 "$ZIP_NAME")" = "$APPIMAGE_NAME"
      - name: Upload Linux ZIP
        uses: actions/upload-artifact@v7
        with:
          name: linux-zip-${{ matrix.arch }}
          path: Linux_MISRC_GUI_*_${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error

  android-apk:
    name: Android APK build (arm64-v8a)
    runs-on: ubuntu-22.04
    needs:
      - preflight-guard-tests
      - preflight-cross-platform-guards
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve build version
        id: version
        env:
          GITHUB_REF: ${{ github.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_CREATE_RELEASE: ${{ github.event.inputs.create_release }}
          CI_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -eux
          VERSION="$(misrc_tools/ci-resolve-version.sh)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK + NDK
        run: |
          set -eux
          export ANDROID_HOME="$HOME/Android/Sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/android-cmdtools
          mv /tmp/android-cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          rm /tmp/cmdtools.zip
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true
          yes 2>/dev/null | sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-30" "platforms;android-34" "ndk;25.2.9519653" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake meson ninja-build nasm pkg-config curl zip unzip

      - name: Cross-build Android deps
        run: |
          set -eux
          export DEPS_PREFIX="$PWD/.deps/install-android-arm64"
          bash android/build-deps-android.sh

      - name: Generate Meson cross-file
        run: |
          set -eux
          export DEPS_PREFIX="$PWD/.deps/install-android-arm64"
          bash android/gen-cross-file.sh

      - name: Cross-compile misrc_gui (libmisrc_gui.so)
        run: |
          set -eux
          export DEPS_PREFIX="$PWD/.deps/install-android-arm64"
          export PKG_CONFIG="$PWD/android/android-pkg-config"
          meson setup --cross-file android/aarch64-linux-android.ini -Dbuildtype=release build-android misrc_tools
          meson compile -C build-android misrc_gui
          test -f build-android/libmisrc_gui.so

      - name: Build + sign APK
        env:
          MISRC_TOOLS_VERSION_OVERRIDE: ${{ steps.version.outputs.version }}
        run: |
          set -eux
          export DEPS_PREFIX="$PWD/.deps/install-android-arm64"
          export BUILD_DIR="$PWD/build-android"
          bash android/build-apk.sh

      - name: Verify APK
        run: |
          set -eux
          APK=$(ls -t .ci-artifacts/android-apk/*.apk | head -1)
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -q "sdkVersion:'30'"
          echo "$BADGING" | grep -q "targetSdkVersion:'34'"
          echo "$BADGING" | grep -q "package: name='dev.misrc.gui'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmisrc_gui.so"
          unzip -p "$APK" lib/arm64-v8a/libmisrc_gui.so | file - | grep -q "ARM aarch64"
          NDK_TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "${NDK_TOOLCHAIN}/llvm-readelf" -d build-android/libmisrc_gui.so | grep NEEDED | grep -iE "/usr/lib/x86_64|/usr/local/lib" && {
            echo "ERROR: host x86_64 lib leaked into arm64 cross build"; exit 1; } || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-arm64
          path: .ci-artifacts/android-apk/*.apk
          if-no-files-found: error

  windows-exe:
    name: Windows EXE build (x86_64)
    runs-on: windows-2022
    needs:
      - preflight-guard-tests
      - preflight-cross-platform-guards
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache vendored deps (.deps/install)
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: .deps/install
          # Key names the ucrt64 toolchain: MINGW64 is deprecated by MSYS2
          # (run 37035393223 emitted the deprecation annotation) and this job
          # migrated to UCRT64, so a stale MINGW64-built (msvcrt-based)
          # .deps/install must never be reused by the UCRT64 job.
          key: deps-windows-ucrt64-x86_64-raylib5.5-libuvc-v0.0.7-${{ hashFiles('third_party/hsdaoh/**') }}

      # MINGW64 is deprecated by MSYS2 (run 37035393223 emitted the
      # '[msystem-mingw64] MINGW64 is deprecated. Migrate to UCRT64 or
      # CLANG64' annotation). UCRT64 keeps the gcc toolchain (same code path
      # meson.build selects for gcc: -lgomp, no getopt shim) and statically
      # links the UCRT via the existing -static ldflags.
      - name: Setup MSYS2 (cached)
        id: setup_msys2_cached
        continue-on-error: true
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-flac
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-libsoxr
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Setup MSYS2 (retry no cache)
        if: steps.setup_msys2_cached.outcome == 'failure'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-flac
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-libsoxr
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Resolve build version
        id: version
        env:
          GITHUB_REF: ${{ github.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_CREATE_RELEASE: ${{ github.event.inputs.create_release }}
          CI_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          VERSION="$(misrc_tools/ci-resolve-version.sh)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and package EXE
        shell: msys2 {0}
        env:
          MISRC_TOOLS_VERSION_OVERRIDE: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DEPS_PREFIX="$PWD/.deps/install"
          export PKG_CONFIG_PATH="$DEPS_PREFIX/lib/pkgconfig:$DEPS_PREFIX/lib64/pkgconfig:${MINGW_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          # Cache hit guard: skip libuvc/hsdaoh/raylib rebuild if .deps/install
          # was restored from actions/cache (key includes hashFiles(hsdaoh/**)).
          if [[ ! -f "$DEPS_PREFIX/lib/pkgconfig/hsdaoh.pc" ]]; then
          git clone --depth 1 --branch v0.0.7 https://github.com/libuvc/libuvc.git .deps/libuvc
          sed -i 's/^if (MSVC OR MINGW)$/if (MSVC)/' .deps/libuvc/cmake/FindLibUSB.cmake
          cmake -S .deps/libuvc -B .deps/libuvc/build -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_BUILD_TARGET=Static \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLE=OFF \
            -DBUILD_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX"
          cmake --build .deps/libuvc/build --parallel
          cmake --install .deps/libuvc/build
          mkdir -p .deps

          rm -rf .deps/hsdaoh
          cp -R third_party/hsdaoh .deps/hsdaoh
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git .deps/raylib
          cmake -S .deps/hsdaoh -B .deps/hsdaoh/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DINSTALL_UDEV_RULES=OFF
          cmake --build .deps/hsdaoh/build --target hsdaoh_static --parallel
          mkdir -p "$DEPS_PREFIX/include" "$DEPS_PREFIX/lib" "$DEPS_PREFIX/lib/pkgconfig"
          for hdr in hsdaoh.h hsdaoh_export.h hsdaoh_raw.h hsdaoh_crc.h; do
            if [[ -f ".deps/hsdaoh/include/$hdr" ]]; then
              cp ".deps/hsdaoh/include/$hdr" "$DEPS_PREFIX/include/"
            fi
          done
          if [[ -f .deps/hsdaoh/build/src/libhsdaoh.a ]]; then
            cp .deps/hsdaoh/build/src/libhsdaoh.a "$DEPS_PREFIX/lib/libhsdaoh.a"
          elif [[ -f .deps/hsdaoh/build/src/libhsdaoh_static.a ]]; then
            cp .deps/hsdaoh/build/src/libhsdaoh_static.a "$DEPS_PREFIX/lib/libhsdaoh.a"
          elif [[ -f .deps/hsdaoh/build/src/hsdaoh_static.lib ]]; then
            cp .deps/hsdaoh/build/src/hsdaoh_static.lib "$DEPS_PREFIX/lib/libhsdaoh.a"
          else
            echo "hsdaoh static library not found in expected build output paths" >&2
            exit 1
          fi
          cp .deps/hsdaoh/build/libhsdaoh.pc "$DEPS_PREFIX/lib/pkgconfig/libhsdaoh.pc"
          sed -i 's/^Libs: .*/Libs: -L${libdir} -lhsdaoh -luvc -lusb-1.0/' "$DEPS_PREFIX/lib/pkgconfig/libhsdaoh.pc"
          for PCDIR in "$DEPS_PREFIX/lib/pkgconfig" "$DEPS_PREFIX/lib64/pkgconfig"; do
            if [[ -f "$PCDIR/libhsdaoh.pc" && ! -f "$PCDIR/hsdaoh.pc" ]]; then
              cp "$PCDIR/libhsdaoh.pc" "$PCDIR/hsdaoh.pc"
            fi
          done
          cmake -S .deps/raylib -B .deps/raylib/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX"
          cmake --build .deps/raylib/build --parallel
          cmake --install .deps/raylib/build
          else
            echo "deps cache hit - skipping libuvc/hsdaoh/raylib rebuild"
          fi

          export PKG_CONFIG_PATH="$DEPS_PREFIX/lib/pkgconfig:$DEPS_PREFIX/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="$DEPS_PREFIX:${CMAKE_PREFIX_PATH:-}"
          pkg-config --modversion fftw3f
          meson setup "$BUILD_DIR" misrc_tools --buildtype release
          meson compile -C "$BUILD_DIR" misrc_capture misrc_extract misrc_gui

          mkdir -p dist
          cp "$BUILD_DIR/misrc_gui.exe" dist/MISRC.exe
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(objdump -p dist/MISRC.exe | awk '/^Subsystem[[:space:]]/ {print $2; exit}')" = "00000002"
          assert_no_nonsystem_dlls() {
            local target="$1"
            while IFS= read -r dll; do
              case "$(echo "$dll" | tr '[:lower:]' '[:upper:]')" in
                API-MS-WIN-*|KERNEL32.DLL|KERNELBASE.DLL|USER32.DLL|GDI32.DLL|SHELL32.DLL|WINMM.DLL|OLE32.DLL|OLEAUT32.DLL|ADVAPI32.DLL|COMDLG32.DLL|COMCTL32.DLL|SHLWAPI.DLL|WS2_32.DLL|SETUPAPI.DLL|IMM32.DLL|VERSION.DLL|UCRTBASE.DLL|MSVCRT.DLL|MF.DLL|MFPLAT.DLL|MFREADWRITE.DLL|EVR.DLL|STRMIIDS.DLL|AVRT.DLL)
                  continue
                  ;;
                *)
                  echo "Non-system runtime DLL dependency detected in $target: $dll" >&2
                  exit 1
                  ;;
              esac
            done < <(objdump -p "$target" | awk '/DLL Name:/ {print $3}')
          }

          assert_no_nonsystem_dlls "dist/MISRC.exe"
          ./dist/MISRC.exe --smoke-test
          set +e
          "$BUILD_DIR/misrc_capture.exe" -h > capture_help.txt 2>&1
          RC_CAPTURE=$?
          "$BUILD_DIR/misrc_extract.exe" -h > extract_help.txt 2>&1
          RC_EXTRACT=$?
          set -e
          test "$RC_CAPTURE" -eq 1
          test "$RC_EXTRACT" -eq 1
          grep -qi "Usage" capture_help.txt
          grep -qi "Usage" extract_help.txt

          # Post-build CI guard tests: assert no stale hsdaoh DLL dependency
          # (Windows statically links the vendored .deps/install libhsdaoh.a)
          # and that FX3 symbols compiled in. Uses MSYS2 python + objdump.
          python misrc_tools/test/ci_guard_tests.py --post-build --gui-path "$BUILD_DIR/misrc_gui.exe"

      - name: Create ZIP artifact
        shell: pwsh
        run: |
          $ZipPath = "Windows_MISRC_GUI_${{ steps.version.outputs.version }}_x86.zip"
          Compress-Archive -Path @("dist/MISRC.exe") -DestinationPath $ZipPath -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $ZipPath))
          try {
            if ($zip.Entries.Count -ne 1) {
              throw "Expected 1 entry in $ZipPath, found $($zip.Entries.Count)"
            }
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.Contains('/') -or $entry.FullName.Contains('\')) {
                throw "ZIP entry is nested; expected flat layout: $($entry.FullName)"
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: Windows_MISRC_GUI_*_x86.zip
          if-no-files-found: error
